[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patentagent"
version = "0.3.0"
description = "Self-contained patent structure and activity extraction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
    "openai>=1.60,<3",
    "PyMuPDF>=1.24,<2",
    "Pillow>=10,<12",
    "numpy>=1.26,<2",
    "rdkit>=2024.3,<2025",
    "pandas>=2.2,<3",
    "pyarrow>=15,<20",
    "huggingface-hub>=1.5,<2",
]

[project.optional-dependencies]
inference = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers==5.6.2",
    "peft>=0.19,<0.20",
    "accelerate>=1.13,<2",
    "qwen-vl-utils>=0.0.14,<0.1",
    "sentencepiece>=0.2,<0.3",
    "tiktoken>=0.7,<1",
    "timm>=1.0,<2",
    "opencv-python<4.12",
    "opencv-python-headless<4.12",
    "DECIMER-Segmentation==1.5.0",
]

[project.scripts]
patentagent = "patentagent.cli:main"

[tool.setuptools]
py-modules = ["gateway", "review_app", "integrate_prototype"]

[tool.setuptools.packages.find]
include = ["patentagent*"]

[tool.setuptools.package-data]
patentagent = ["_vendor/**/*.json", "_vendor/**/*.txt", "static/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/._*", "**/__pycache__/*", "**/*.pyc"]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.8"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["patentagent/_vendor", "review_static", "ketcher_src", "._*"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
